name: Release

# Every merge to main is released as the next patch version. Put [minor] or
# [major] in the PR title (or commit message) to bump that part instead.
# A v* tag pushed by hand (make release) is released as-is.
#
# Go requires v2+ modules to end their module path in /vN, so a v2+ version
# fails here unless go.mod has already been updated to match.
on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run checks
        run: make all

      - name: Set version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          check_module_path() {
            major=${1#v}
            major=${major%%.*}
            module=$(go list -m)
            if [ "$major" -ge 2 ] && [ "${module##*/}" != "v$major" ]; then
              echo "::error::$1 needs the module path to end in /v$major (go.mod has $module). Update go.mod and imports first; see https://go.dev/doc/modules/major-version"
              exit 1
            fi
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            check_module_path "$GITHUB_REF_NAME"
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            exit 0
          fi
          if existing=$(git tag --points-at HEAD --list 'v*' | head -n1) && [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing; nothing to release."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            patch=${patch%%-*}
            case "$COMMIT_MESSAGE" in
              *"[major]"*) next="v$((major + 1)).0.0" ;;
              *"[minor]"*) next="v${major}.$((minor + 1)).0" ;;
              *)           next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          check_module_path "$next"
          git tag "$next"
          git push origin "$next"
          echo "VERSION=$next" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.VERSION != ''
        run: gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Index on the Go module proxy
        if: env.VERSION != ''
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@${VERSION}"
